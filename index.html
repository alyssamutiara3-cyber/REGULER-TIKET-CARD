<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POLIPONI 2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,Helvetica,sans-serif;
color:#fff;
overflow:hidden;
}

/* BACKGROUND IMG FIX */
.bg-img{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* BOX */
.box{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
width:95%;max-width:600px;
background:rgba(0,0,0,0.75);
border:2px solid #00ffd5;
padding:25px;
border-radius:12px;
backdrop-filter:blur(8px);
}

/* TEXT */
.logo{
font-size:42px;
font-weight:900;
text-align:center;
color:#00ffd5;
}

.sub{text-align:center;font-size:13px;opacity:.7}

/* BUTTON */
.btn{
margin-top:20px;
width:100%;
padding:14px;
border:none;
background:#00ffd5;
color:#000;
font-weight:900;
cursor:pointer;
opacity:.4;
}

</style>
</head>

<body>

<!-- BACKGROUND (INI YANG PENTING) -->
<img src="background.jpg" class="bg-img">

<div class="overlay"></div>

<div class="box">
<div class="logo">POLIPONI</div>
<div class="sub">LIVE TICKET SYSTEM</div>

<button class="btn">MASUK</button>
</div>

</body>
</html>
